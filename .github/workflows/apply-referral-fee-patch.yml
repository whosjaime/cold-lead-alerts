name: Apply YTJobs Referral Fee Patch

on:
  push:
    paths:
      - ".github/workflows/apply-referral-fee-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-referral-fee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch creator job alerts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("creator_job_alerts.py")
          text = path.read_text()
          original = text

          # Add referral fee formatting to Discord messages.
          discord_needle = '''    url = (job.get("url") or "").strip()

    role_line, allowed_mentions = build_role_line_and_mentions(title, description)
'''
          discord_replacement = '''    url = (job.get("url") or "").strip()
          referral_bonus = job.get("referral_bonus")
          referral_fee_line = ""

          if source == "YTJobs" and referral_bonus is not None:
              try:
                  referral_fee_line = f"**Referral Fee:** ${float(referral_bonus):,.0f}\\n"
              except (TypeError, ValueError):
                  referral_fee_line = f"**Referral Fee:** {referral_bonus}\\n"

          role_line, allowed_mentions = build_role_line_and_mentions(title, description)
'''
          if "referral_fee_line" not in text:
              text = text.replace(discord_needle, discord_replacement)

          # Add the referral fee line right after Pay in the non-X Discord alert.
          text = text.replace(
              '''            f"**Pay:** {pay}\\n"
              f"**Description:** {description}\\n"
''',
              '''            f"**Pay:** {pay}\\n"
              f"{referral_fee_line}"
              f"**Description:** {description}\\n"
'''
          )

          # Move YTJobs enrichment before Discord so referral fees are available before the message sends.
          old_order = '''    try:
          send_to_discord(job)
      except Exception as e:
          print(f"Discord post failed for {source}, will retry next run: {e}")
          return None

      try:
          enrich_public_email(job)
      except Exception as e:
          print(f"Email enrichment failed for {source}: {e}")

      # Enrich YTJobs with subscriber and referral bonus data
      if source == "YTJobs":
          try:
              await enrich_ytjobs_with_page_data(page, job)
          except Exception as e:
              print(f"YTJobs enrichment failed for {source}: {e}")
'''
          new_order = '''    # Enrich YTJobs with subscriber and referral bonus data before Discord/Monday
      if source == "YTJobs":
          try:
              await enrich_ytjobs_with_page_data(page, job)
          except Exception as e:
              print(f"YTJobs enrichment failed for {source}: {e}")

      try:
          send_to_discord(job)
      except Exception as e:
          print(f"Discord post failed for {source}, will retry next run: {e}")
          return None

      try:
          enrich_public_email(job)
      except Exception as e:
          print(f"Email enrichment failed for {source}: {e}")
'''
          text = text.replace(old_order, new_order)

          if text == original:
              print("No creator_job_alerts.py changes needed.")
          else:
              path.write_text(text)
              print("Patched creator_job_alerts.py")

          # This is a one-time patch workflow. Remove it after applying the source change.
          Path(".github/workflows/apply-referral-fee-patch.yml").unlink(missing_ok=True)
          PY

      - name: Commit patched code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator_job_alerts.py .github/workflows/apply-referral-fee-patch.yml
          if git diff --staged --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Add YTJobs referral fee to Discord alerts"
            git push
          fi
